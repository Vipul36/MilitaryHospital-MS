services:
  # 1. API Backend Service
  - type: web
    name: mhshms-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: mhshms-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mhshms-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: mhshms-ai
          property: host

  # 2. AI Python Service
  - type: web
    name: mhshms-ai
    env: docker
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: ./apps/ai-service
    region: singapore
    plan: free

  # 3. Redis Service
  - type: redis
    name: mhshms-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  # 3. PostgreSQL Database
  - name: mhshms-postgres
    databaseName: mhshms
    user: mhshms_user
    plan: free
    region: singapore
    ipAllowList: []

# 4. Redis Cache / Broker
# Note: Render Redis services can be added via the Render Dashboard.
