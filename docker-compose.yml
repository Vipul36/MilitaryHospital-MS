version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mhshms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mhshms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mhshms_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ai-service:
    build:
      context: ./apps/ai-service
    container_name: mhshms_ai
    ports:
      - '8000:8000'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: mhshms_api
    ports:
      - '5001:5001'
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/mhshms?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=military_hospital_secret_jwt_key_2026
      - PORT=5001
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: mhshms_web
    ports:
      - '80:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
